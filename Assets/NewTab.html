<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        :root { --bg: #f5f5f5; --text: #1e1e1e; --accent: #0078D4; --accentHover: #106EBE; --surface: #ffffff; --border: #cccccc; }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #1E1E1E; --text: #E6E6E6; --accent: #0E639C; --accentHover: #1177BB; --surface: #252526; --border: #3F3F46; }
        }
        * { box-sizing: border-box; }
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); color: var(--text); }
        #logo { font-size: 64px; font-weight: bold; letter-spacing: 3px; margin-bottom: 40px; background: linear-gradient(135deg, var(--accent), var(--accentHover)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #searchBox { width: 560px; max-width: 80%; padding: 14px 22px; font-size: 18px; border: 1px solid var(--border); border-radius: 28px; outline: none; background: var(--surface); color: var(--text); }
        #searchBox:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(14, 99, 156, 0.25); }
        #aganButton { margin-top: 26px; padding: 12px 34px; font-size: 16px; background: var(--accent); color: white; border: none; border-radius: 24px; cursor: pointer; transition: background 0.15s; }
        #aganButton:hover { background: var(--accentHover); }
    </style>
</head>
<body>
    <div id="logo">Ağan</div>
    <input id="searchBox" type="text" placeholder="Ara veya URL gir..." autofocus />
    <button id="aganButton">Ağan ile konuş</button>
    <script>
        document.getElementById('searchBox').addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && this.value.trim() !== '') {
                window.chrome.webview.postMessage('navigate:' + this.value.trim());
            }
        });
        document.getElementById('aganButton').addEventListener('click', function () {
            window.chrome.webview.postMessage('open-agan');
        });
    </script>
</body>
</html>
