<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        :root { --bg: #0F0F14; --surface: #1A1A22; --text: #FFFFFF; --muted: #8A8A95; --accent: #6366F1; --border: #2A2A35; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 60px 20px 20px; overflow-y: auto; }
        #clock { font-size: 72px; font-weight: 200; letter-spacing: -2px; background: linear-gradient(135deg, var(--accent), #A78BFA); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
        #date { color: var(--muted); font-size: 16px; margin-bottom: 32px; }
        #searchBox { width: 100%; max-width: 620px; padding: 16px 24px; font-size: 18px; border-radius: 30px; border: 1px solid var(--border); background: var(--surface); color: var(--text); outline: none; transition: border-color 0.2s; }
        #searchBox:focus { border-color: var(--accent); }
        #dashboard { width: 100%; max-width: 900px; margin-top: 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
        .card h3 { font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
        .quick-link { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
        .quick-link:hover { color: var(--accent); }
        .quick-link:last-child { border-bottom: none; }
        #quote { font-style: italic; line-height: 1.6; color: var(--text); }
        #aganButton { margin-top: 24px; padding: 12px 32px; background: var(--accent); color: white; border: none; border-radius: 24px; font-size: 15px; cursor: pointer; }
        .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
    </style>
</head>
<body>
    <div id="clock">00:00</div>
    <div id="date">Yükleniyor...</div>
    <input id="searchBox" type="text" placeholder="Ara veya URL gir..." autofocus>
    <div id="dashboard">
        <div class="card">
            <h3>📌 Hızlı Erişim (Yer İmleri)</h3>
            <div id="quickLinks"></div>
        </div>
        <div class="card">
            <h3>💭 Günün Sözü</h3>
            <p id="quote">Yükleniyor...</p>
        </div>
    </div>
    <button id="aganButton" onclick="window.chrome.webview.postMessage('open-agan')">🤖 Ağan ile Konuş</button>
    <script>
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = h + ':' + m;
            const days = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'];
            const months = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
            document.getElementById('date').textContent = `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        document.getElementById('searchBox').addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && this.value.trim() !== '') {
                window.chrome.webview.postMessage('navigate:' + this.value.trim());
            }
        });

        function openUrl(url) { window.chrome.webview.postMessage('navigate:' + url); }

        window.chrome.webview.addEventListener('message', function (e) {
            const data = e.data;
            
            if (data && data.type === 'bookmarks') {
                const container = document.getElementById('quickLinks');
                container.innerHTML = '';
                if (!data.items || data.items.length === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'empty';
                    empty.textContent = 'Henüz yer imi yok. Bir siteye gidip "⭐ Bu Sayfayı Ekle" butonuna basın.';
                    container.appendChild(empty);
                } else {
                    data.items.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'quick-link';
                        div.onclick = () => openUrl(item.url);
                        const nameSpan = document.createElement('span');
                        nameSpan.textContent = item.name || item.url;
                        const arrowSpan = document.createElement('span');
                        arrowSpan.textContent = '→';
                        div.appendChild(nameSpan);
                        div.appendChild(arrowSpan);
                        container.appendChild(div);
                    });
                }
            }
            
            if (data && data.type === 'quotes' && data.data && data.data.length > 0) {
                const quotes = data.data;
                const now = new Date();
                const start = new Date(now.getFullYear(), 0, 0);
                const diff = now - start;
                const oneDay = 1000 * 60 * 60 * 24;
                const dayOfYear = Math.floor(diff / oneDay);
                
                const index = (dayOfYear - 1) % quotes.length;
                const quote = quotes[index];
                
                document.getElementById('quote').textContent = `"${quote.text}" — ${quote.author}`;
            }
        });

        window.chrome.webview.postMessage(JSON.stringify({ type: 'get-bookmarks' }));
        window.chrome.webview.postMessage(JSON.stringify({ type: 'get-quotes' }));
    </script>
</body>
</html>
