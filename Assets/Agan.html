<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Ağan</title>
    <style>
        :root { --bg: #1A1A1A; --surface: #2D2D30; --text: #FFFFFF; --muted: #D0D0D0; --accent: #1177BB; --accentHover: #1E8EDB; --border: #5A5A5F; }
        @media (prefers-color-scheme: light) {
            :root { --bg: #F5F5F5; --surface: #FFFFFF; --text: #1A1A1A; --muted: #4A4A4A; --accent: #0078D4; --accentHover: #106EBE; --border: #AAAAAA; }
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
        header { padding: 14px 22px; background: var(--surface); border-bottom: 1px solid var(--border); font-weight: bold; font-size: 18px; letter-spacing: 1px; display: flex; justify-content: space-between; align-items: center; }
        #status { font-size: 12px; font-weight: normal; color: var(--muted); }
        #context { padding: 8px 22px; font-size: 12px; color: var(--muted); background: var(--surface); border-bottom: 1px solid var(--border); }
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .msg { padding: 10px 14px; border-radius: 10px; max-width: 80%; white-space: pre-wrap; word-wrap: break-word; line-height: 1.5; font-size: 14px; }
        .user { align-self: flex-end; background: var(--accent); color: white; }
        .assistant { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); }
        .system { align-self: center; background: transparent; color: var(--muted); font-size: 12px; font-style: italic; }
        footer { padding: 14px 20px; background: var(--surface); border-top: 1px solid var(--border); display: flex; gap: 8px; }
        #input { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-family: inherit; font-size: 14px; resize: none; outline: none; }
        #input:focus { border-color: var(--accent); }
        #send { padding: 10px 22px; border: none; border-radius: 8px; background: var(--accent); color: white; cursor: pointer; font-weight: 500; }
        #send:hover { background: var(--accentHover); }
        #send:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <header>
        <span>Ağan</span>
        <span id="status">Bağlantı kontrol ediliyor...</span>
    </header>
    <div id="context">Henüz sayfa bağlamı yok.</div>
    <div id="messages"></div>
    <footer>
        <textarea id="input" rows="2" placeholder="Ağan'a sor... (ipucu: hatırla: İstanbulluyum)"></textarea>
        <button id="send">Gönder</button>
    </footer>
    <script>
        const messages = document.getElementById('messages');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send');
        const contextEl = document.getElementById('context');
        const statusEl = document.getElementById('status');
        let busy = false;
        let currentAssistantBubble = null;

        function addMessage(role, text) {
            const div = document.createElement('div');
            div.className = 'msg ' + role;
            div.textContent = text;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
            return div;
        }

        function setBusy(state) {
            busy = state;
            sendBtn.disabled = state;
        }

        function send() {
            const text = input.value.trim();
            if (!text || busy) return;
            setBusy(true);
            addMessage('user', text);
            input.value = '';
            currentAssistantBubble = addMessage('assistant', '');
            window.chrome.webview.postMessage(JSON.stringify({ type: 'chat', text: text }));
        }

        sendBtn.addEventListener('click', send);
        input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                send();
            }
        });

        window.chrome.webview.addEventListener('message', function (e) {
            const data = e.data;
            if (data.type === 'status') {
                statusEl.textContent = data.text;
            } else if (data.type === 'context') {
                contextEl.textContent = data.url ? 'Bağlam: ' + data.url + ' (' + data.size + ' karakter)' : 'Bağlam: yok';
            } else if (data.type === 'chunk') {
                if (currentAssistantBubble) {
                    currentAssistantBubble.textContent += data.text;
                    messages.scrollTop = messages.scrollHeight;
                }
            } else if (data.type === 'done') {
                setBusy(false);
                currentAssistantBubble = null;
            } else if (data.type === 'error') {
                addMessage('system', 'Hata: ' + data.text);
                setBusy(false);
                currentAssistantBubble = null;
            }
        });

        window.chrome.webview.postMessage(JSON.stringify({ type: 'ready' }));
    </script>
</body>
</html>
