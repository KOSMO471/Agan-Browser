<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Ağan</title>
    <style>
        :root { --bg: #0F0F14; --surface: #1A1A22; --text: #FFFFFF; --muted: #8A8A95; --accent: #6366F1; --accentHover: #818CF8; --border: #2A2A35; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
        header { padding: 16px 24px; background: var(--surface); border-bottom: 1px solid var(--border); font-weight: 600; font-size: 18px; display: flex; align-items: center; gap: 10px; }
        header::before { content: "🤖"; font-size: 20px; }
        #context { padding: 10px 24px; font-size: 12px; color: var(--muted); background: var(--surface); border-bottom: 1px solid var(--border); }
        #messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
        .msg { padding: 12px 16px; border-radius: 12px; max-width: 80%; white-space: pre-wrap; word-wrap: break-word; line-height: 1.6; font-size: 14.5px; }
        .user { align-self: flex-end; background: var(--accent); color: white; }
        .assistant { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); }
        .system { align-self: center; background: transparent; color: var(--muted); font-size: 12px; font-style: italic; }
        footer { padding: 16px 24px; background: var(--surface); border-top: 1px solid var(--border); display: flex; gap: 10px; }
        #input { flex: 1; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-family: inherit; font-size: 14px; resize: none; outline: none; transition: border-color 0.2s; }
        #input:focus { border-color: var(--accent); }
        #send { padding: 12px 24px; border: none; border-radius: 10px; background: var(--accent); color: white; cursor: pointer; font-weight: 500; font-size: 14px; transition: background 0.2s; }
        #send:hover { background: var(--accentHover); }
        #send:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <header>Ağan</header>
    <div id="context">Henüz sayfa bağlamı yok. Bir sayfada "Siteyi Ağan'a İlet" butonunu kullanın.</div>
    <div id="messages"></div>
    <footer>
        <textarea id="input" rows="2" placeholder="Ağan'a bir şey sor..."></textarea>
        <button id="send">Gönder</button>
    </footer>
    <script>
        const messages = document.getElementById('messages');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send');
        const contextEl = document.getElementById('context');
        let busy = false;

        function addMessage(role, text) {
            const div = document.createElement('div');
            div.className = 'msg ' + role;
            div.textContent = text;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
            return div;
        }

        function setBusy(state) {
            busy = state;
            sendBtn.disabled = state;
        }

        function send() {
            const text = input.value.trim();
            if (!text || busy) return;
            setBusy(true);
            addMessage('user', text);
            input.value = '';
            window.chrome.webview.postMessage(JSON.stringify({ type: 'chat', text: text }));
        }

        sendBtn.addEventListener('click', send);
        input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                send();
            }
        });

        window.chrome.webview.addEventListener('message', function (e) {
            const data = e.data;
            if (data.type === 'context') {
                contextEl.textContent = data.url ? 'Bağlam: ' + data.url + ' (' + data.size + ' karakter)' : 'Bağlam: yok';
                addMessage('system', 'Sayfa bağlamı yüklendi.');
            } else if (data.type === 'chat') {
                addMessage('user', data.text);
                setBusy(true);
                window.chrome.webview.postMessage(JSON.stringify({ type: 'chat', text: data.text }));
            } else if (data.type === 'chunk') {
                if (messages.lastChild && messages.lastChild.classList.contains('assistant')) {
                    messages.lastChild.textContent += data.text;
                } else {
                    addMessage('assistant', data.text);
                }
                messages.scrollTop = messages.scrollHeight;
            } else if (data.type === 'done') {
                setBusy(false);
            } else if (data.type === 'error') {
                addMessage('system', 'Hata: ' + data.text);
                setBusy(false);
            }
        });

        window.chrome.webview.postMessage(JSON.stringify({ type: 'ready' }));
    </script>
</body>
</html>
