<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 320px; margin: 0; font-family: 'Segoe UI', sans-serif; background: #1A1A1A; color: #fff; }
    h3 { margin: 12px; font-size: 14px; color: #1E8EDB; }
    #liste { max-height: 400px; overflow-y: auto; }
    .gorsel { display: flex; gap: 8px; padding: 8px; border-bottom: 1px solid #3F3F46; align-items: center; }
    .gorsel img { width: 48px; height: 48px; object-fit: cover; border-radius: 4px; background: #2D2D30; }
    .gorsel button { margin-left: auto; padding: 4px 10px; background: #1177BB; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .gorsel button:hover { background: #1E8EDB; }
    #bos { padding: 20px; text-align: center; color: #D0D0D0; font-size: 12px; }
  </style>
</head>
<body>
  <h3>Sayfadaki Görseller</h3>
  <div id="liste"></div>
  <script src="popup.js"></script>
</body>
</html>
